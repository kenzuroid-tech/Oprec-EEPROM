<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Rekrutmen — Komunitas EEPROM 2026</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .status-page {
      min-height: 100vh;
      position: relative;
      z-index: 1;
      padding: 48px 24px 80px;
    }

    .status-container { max-width: 680px; margin: 0 auto; }

    /* ── Profile Card ─────────────────────── */
    .profile-card {
      background: linear-gradient(135deg, rgba(0,200,255,0.07), rgba(139,92,246,0.07));
      border: 1px solid rgba(0,200,255,0.25);
      border-radius: var(--radius-2xl);
      padding: 32px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(0,200,255,0.12), transparent 70%);
      pointer-events: none;
    }

    .profile-photo {
      width: 80px; height: 80px;
      border-radius: var(--radius-lg);
      object-fit: cover;
      border: 2px solid rgba(0,200,255,0.4);
      flex-shrink: 0;
      background: var(--bg-input);
    }

    .profile-name {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }

    .profile-nim {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--primary);
      background: var(--primary-dim);
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      margin-top: 6px;
    }

    /* ── Data Card ───────────────────────── */
    .data-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px 24px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .data-item .label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .data-item .value {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-all;
    }

    /* ── Status Banner ───────────────────── */
    .status-banner {
      border-radius: var(--radius-xl);
      padding: 20px 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid;
    }

    .status-icon-wrap {
      width: 52px; height: 52px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    /* ── Timeline ────────────────────────── */
    .stage-timeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin-bottom: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px 20px;
    }

    .stage-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .stage-item:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 20px;
      right: calc(-50% + 20px);
      width: calc(100% - 40px);
      height: 2px;
      background: var(--border);
    }

    .stage-item.done:not(:last-child)::after,
    .stage-item.active:not(:last-child)::after { background: var(--primary); }

    .stage-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      z-index: 1;
    }

    .stage-item.done .stage-icon  { background: var(--primary); border-color: var(--primary); color: #000; }
    .stage-item.active .stage-icon { background: var(--primary-dim); border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
    .stage-item.rejected .stage-icon { background: var(--error-dim); border-color: var(--error); }

    .stage-label { font-size: 0.7rem; color: var(--text-muted); text-align: center; font-weight: 500; }
    .stage-item.active .stage-label { color: var(--primary); font-weight: 700; }
    .stage-item.done .stage-label { color: var(--text-secondary); }

    /* ── Hasil Tes ───────────────────────── */
    .info-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px 24px;
      margin-bottom: 16px;
    }

    .info-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--primary-dim);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .info-item .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 3px; }
    .info-item .value { font-size: 0.92rem; font-weight: 600; }

    @media (max-width: 600px) {
      .stage-timeline { grid-template-columns: repeat(2, 1fr); }
      .data-grid { grid-template-columns: 1fr; }
      .info-grid { grid-template-columns: 1fr; }
      .profile-card { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="status-page">
    <div class="status-container">
      <a href="login.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);text-decoration:none;font-size:0.88rem;margin-bottom:28px;transition:var(--transition);" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-secondary)'">
        ← Kembali
      </a>

      <div id="main-content">
        <div style="text-align:center;padding:60px 0;color:var(--text-secondary);">
          <div style="font-size:36px;margin-bottom:12px;animation:float 2s ease infinite;">⏳</div>
          Memuat data...
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getCollection } from '../js/firebase-config.js';
    import { showToast, getStatusLabel } from '../js/utils.js';

    const pesertaSession = JSON.parse(sessionStorage.getItem('peserta'));
    if (!pesertaSession) { window.location.href = 'login.html'; }

    // Convert Google Drive link to embeddable thumbnail URL
    function getDriveThumb(link) {
      if (!link) return null;
      const match = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match) return `https://lh3.googleusercontent.com/d/${match[1]}=s200`;
      return null;
    }

    async function loadStatus() {
      try {
        const results = await getCollection('pendaftar', [['nim', '==', pesertaSession.nim]]);
        if (!results.length) { showToast('Data tidak ditemukan', 'error'); return; }

        const p = results[0];
        const statusMap = { daftar: 0, tes_tulis: 1, menunggu_penilaian: 1, wawancara: 2, diterima: 3, ditolak: -1 };
        const currentStage = statusMap[p.status] ?? 0;

        // Load test result
        let hasilTes = null;
        try {
          const tesResults = await getCollection('hasil_tes', [['nim', '==', p.nim]]);
          if (tesResults.length > 0) hasilTes = tesResults[tesResults.length - 1];
        } catch {}

        // Load interview result
        let hasilWawancara = null;
        try {
          const wResults = await getCollection('wawancara', [['nim', '==', p.nim]]);
          if (wResults.length > 0) hasilWawancara = wResults[wResults.length - 1];
        } catch {}

        // ── Timeline ────────────────────────────
        const stages = [
          { icon: '📋', label: 'Pendaftaran' },
          { icon: '✏️', label: 'Tes Tulis' },
          { icon: '🎤', label: 'Wawancara' },
          { icon: p.status === 'diterima' ? '🎉' : '🏁', label: 'Pengumuman' }
        ];

        const stagesHtml = stages.map((s, i) => {
          let cls = '';
          if (p.status === 'ditolak' && i <= currentStage) cls = i === currentStage ? 'rejected' : 'done';
          else if (i < currentStage || (p.status === 'diterima' && i <= 3)) cls = 'done';
          else if (i === currentStage) cls = 'active';
          return `<div class="stage-item ${cls}">
            <div class="stage-icon">${s.icon}</div>
            <div class="stage-label">${s.label}</div>
          </div>`;
        }).join('');

        // ── Status message ───────────────────────
        const statusMessages = {
          daftar:             { icon: '📋', msg: 'Pendaftaran kamu sudah diterima. Tunggu pengumuman jadwal Tes Tulis.', color: 'var(--primary)', bg: 'rgba(0,200,255,0.07)' },
          tes_tulis:          { icon: '✏️', msg: 'Jadwal Tes Tulis sudah dibuka! Klik tombol di bawah untuk mulai tes.', color: 'var(--warning)', bg: 'rgba(245,158,11,0.07)' },
          menunggu_penilaian: { icon: '⏳', msg: 'Tes selesai! Jawaban kamu sedang dinilai oleh admin. Pantau terus halaman ini.', color: 'var(--secondary)', bg: 'rgba(139,92,246,0.07)' },
          wawancara:          { icon: '🎤', msg: 'Selamat! Kamu lolos ke tahap Wawancara. Pantau WhatsApp/email untuk jadwal.', color: 'var(--secondary)', bg: 'rgba(139,92,246,0.07)' },
          diterima:           { icon: '🎉', msg: 'Selamat! Kamu DITERIMA di Komunitas EEPROM 2026!', color: 'var(--success)', bg: 'rgba(16,185,129,0.07)' },
          ditolak:            { icon: '😔', msg: 'Terima kasih telah mengikuti rekrutmen. Tetap semangat!', color: 'var(--error)', bg: 'rgba(239,68,68,0.07)' }
        };
        const sm = statusMessages[p.status] || statusMessages.daftar;

        // ── Action button ────────────────────────
        let actionBtn = '';
        if (p.status === 'tes_tulis') {
          actionBtn = `<div style="margin-bottom:16px;text-align:center;">
            <a href="test.html" class="btn btn-primary btn-lg" style="width:100%;">✏️ Mulai Tes Tulis →</a>
          </div>`;
        }

        // ── Profile photo ────────────────────────
        const thumbUrl = getDriveThumb(p.pasFotoLink);
        const photoHtml = thumbUrl
          ? `<img src="${thumbUrl}" alt="Foto ${p.nama}" class="profile-photo"
              onerror="this.style.display='none'" />`
          : '';

        // ── Test result section ──────────────────
        let tesSection = '';
        if (hasilTes) {
          const pgPct = hasilTes.skorMaksimalPG > 0
            ? Math.round((hasilTes.skorPG / hasilTes.skorMaksimalPG) * 100)
            : null;
          const statusPenilaian = hasilTes.statusPenilaian || 'menunggu_penilaian';

          tesSection = `
            <div class="info-section">
              <div class="info-title">📊 Hasil Tes Tulis</div>
              <div class="info-grid" style="margin-bottom:12px;">
                ${pgPct !== null ? `
                <div class="info-item">
                  <div class="label">Skor Pilihan Ganda</div>
                  <div class="value" style="font-size:1.2rem;font-family:var(--font-mono);color:var(--primary);">
                    ${hasilTes.skorPG} / ${hasilTes.skorMaksimalPG} <span style="font-size:0.85rem;color:var(--text-muted);">(${pgPct}%)</span>
                  </div>
                </div>` : ''}
                <div class="info-item">
                  <div class="label">Essay</div>
                  <div class="value" style="color:var(--warning);">
                    ${statusPenilaian === 'menunggu_penilaian' ? '⏳ Menunggu penilaian admin' : '✅ Sudah dinilai'}
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // ── Interview result ─────────────────────
        let wawancaraSection = '';
        if (hasilWawancara) {
          wawancaraSection = `
            <div class="info-section">
              <div class="info-title">🎤 Hasil Wawancara</div>
              <div class="ai-resume">
                <p class="ai-resume-text">${hasilWawancara.catatan || '-'}</p>
                <div class="ai-recommendation ${hasilWawancara.rekomendasi === 'diterima' ? 'lanjut' : 'tidak'}" style="margin-top:12px;">
                  ${hasilWawancara.rekomendasi === 'diterima' ? '✅ Direkomendasikan DITERIMA' : '❌ Tidak Direkomendasikan'}
                </div>
              </div>
            </div>
          `;
        }

        // ── Render ───────────────────────────────
        document.getElementById('main-content').innerHTML = `

          <!-- 1. Profile Card (nama saja) -->
          <div class="profile-card">
            ${photoHtml}
            <div>
              <div class="profile-name">${p.nama}</div>
              <div class="profile-nim">${p.nim}</div>
            </div>
          </div>

          <!-- 2. Data Pendaftaran -->
          <div class="data-card">
            <div class="card-title">👤 Data Pendaftaran</div>
            <div class="data-grid">
              <div class="data-item">
                <div class="label">Email</div>
                <div class="value">${p.email || '-'}</div>
              </div>
              <div class="data-item">
                <div class="label">No. WhatsApp</div>
                <div class="value">${p.noHp || '-'}</div>
              </div>
              <div class="data-item">
                <div class="label">NIM</div>
                <div class="value" style="font-family:var(--font-mono);">${p.nim || '-'}</div>
              </div>
              <div class="data-item">
                <div class="label">Program Studi</div>
                <div class="value">${p.prodi || '-'}</div>
              </div>
            </div>
          </div>

          <!-- 3. Status Banner -->
          <div class="status-banner" style="background:${sm.bg};border-color:${sm.color};">
            <div class="status-icon-wrap" style="background:${sm.bg};">${sm.icon}</div>
            <div>
              <div style="font-weight:800;color:${sm.color};font-size:0.95rem;margin-bottom:4px;">
                Status: ${getStatusLabel(p.status)}
              </div>
              <div style="font-size:0.85rem;color:var(--text-secondary);">${sm.msg}</div>
            </div>
          </div>

          <!-- 4. Timeline -->
          <div class="stage-timeline">
            ${stagesHtml}
          </div>

          <!-- 5. Action Button -->
          ${actionBtn}

          <!-- 6. Hasil Tes & Wawancara -->
          ${tesSection}
          ${wawancaraSection}

          <!-- 7. Logout -->
          <div style="text-align:center;margin-top:24px;">
            <button onclick="logout()" class="btn btn-ghost btn-sm">🚪 Keluar</button>
          </div>
        `;

      } catch (err) {
        console.error(err);
        showToast('Gagal memuat data: ' + err.message, 'error');
      }
    }

    window.logout = function() {
      sessionStorage.removeItem('peserta');
      window.location.href = 'login.html';
    };

    loadStatus();
  </script>
</body>
</html>
