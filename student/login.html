<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Peserta — Polinema Robotics</title>
  <meta name="description" content="Login peserta untuk mengikuti tes dan melihat status rekrutmen." />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1120;
      background-image: linear-gradient(180deg, rgba(11, 17, 32, 0.95) 0%, rgba(23, 32, 59, 0.85) 50%, rgba(10, 15, 29, 0.98) 100%);
      color: #ffffff;
      font-family: 'Iceberg', sans-serif;
    }

    .login-page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
      box-sizing: border-box;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
    }

    .login-card {
      width: 100%;
      background: rgba(8, 8, 24, 0.9);
      border: 1px solid var(--border, #2d3748);
      border-radius: var(--radius-2xl, 16px);
      padding: 40px;
      backdrop-filter: blur(20px);
      box-sizing: border-box;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
      box-shadow: 0 0 30px var(--primary-glow);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .login-sub {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 0;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="login-page">
    <div class="login-wrapper">
      <a href="../index.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary, #94a3b8); text-decoration: none; font-size: 0.88rem; margin-bottom: 24px; transition: var(--transition, 0.3s);" onmouseover="this.style.color='var(--primary, #3b82f6)'" onmouseout="this.style.color='var(--text-secondary, #94a3b8)'">
        ← Kembali ke Beranda
      </a>

      <div class="login-card">
        <div class="login-logo">
          <div class="login-icon">🤖</div>
          <h1 class="login-title">Portal Peserta</h1>
          <p class="login-sub">Login dengan NIM dan password pendaftaran</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
          <button class="tab-btn" id="tab-status" onclick="switchTab('status')">Cek Status</button>
        </div>

        <!-- Login Form -->
        <div id="panel-login">
          <form id="login-form">
            <div class="form-group">
              <label class="form-label" for="nim-login">NIM</label>
              <input type="text" id="nim-login" class="form-input" placeholder="Nomor Induk Mahasiswa" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="pass-login">Password</label>
              <input type="password" id="pass-login" class="form-input" placeholder="Password pendaftaran" required />
            </div>
            <div id="login-error" style="display:none; background: var(--error-dim); border: 1px solid var(--error); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.85rem; color: var(--error); margin-bottom: 16px;"></div>
            <button type="submit" class="btn btn-primary w-full" id="btn-login">
              Masuk ke Portal
            </button>
          </form>
          <div style="text-align: center; margin-top: 20px; font-size: 0.82rem; color: var(--text-muted);">
            Belum daftar? <a href="../register.html" style="color: var(--primary); text-decoration: none;">Daftar Sekarang →</a>
          </div>
        </div>

        <!-- Status Check (quick, no login) -->
        <div id="panel-status" style="display: none;">
          <form id="status-form">
            <div class="form-group">
              <label class="form-label" for="nim-status">NIM</label>
              <input type="text" id="nim-status" class="form-input" placeholder="Masukkan NIM kamu" required />
            </div>
            <button type="submit" class="btn btn-primary w-full" id="btn-cek">
              🔍 Cek Status
            </button>
          </form>
          <div id="status-result" style="display:none; margin-top: 20px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getCollection } from '../js/firebase-config.js';
    import { showToast, setButtonLoading, getStatusLabel, formatDate } from '../js/utils.js';

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-status').classList.toggle('active', tab === 'status');
      document.getElementById('panel-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('panel-status').style.display = tab === 'status' ? 'block' : 'none';
    }
    window.switchTab = switchTab;

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nim = document.getElementById('nim-login').value.trim();
      const pass = document.getElementById('pass-login').value;
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('login-error');

      setButtonLoading(btn, true);
      errEl.style.display = 'none';

      try {
        const results = await getCollection('pendaftar', [['nim', '==', nim]]);
        if (results.length === 0) {
          throw new Error('NIM tidak ditemukan. Pastikan kamu sudah mendaftar.');
        }

        const peserta = results[0];
        const passwordHash = btoa(pass + nim + 'polinema-robotics-salt');

        if (peserta.passwordHash !== passwordHash) {
          throw new Error('Password salah.');
        }

        // Save session
        sessionStorage.setItem('peserta', JSON.stringify({ id: peserta.id, nim: peserta.nim, nama: peserta.nama, status: peserta.status }));
        showToast(`Selamat datang, ${peserta.nama}! 👋`, 'success');

        // Redirect based on status
        if (peserta.status === 'daftar') {
          window.location.href = 'status.html';
        } else if (peserta.status === 'tes_tulis') {
          window.location.href = 'test.html';
        } else {
          window.location.href = 'status.html';
        }
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        setButtonLoading(btn, false);
      }
    });

    // Status check
    document.getElementById('status-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nim = document.getElementById('nim-status').value.trim();
      const btn = document.getElementById('btn-cek');
      const resultEl = document.getElementById('status-result');

      setButtonLoading(btn, true);
      resultEl.style.display = 'none';

      try {
        const results = await getCollection('pendaftar', [['nim', '==', nim]]);
        if (results.length === 0) {
          resultEl.innerHTML = `
            <div style="background: var(--error-dim); border: 1px solid var(--error); border-radius: var(--radius-md); padding: 16px; text-align: center;">
              <div style="font-size: 24px; margin-bottom: 8px;">❌</div>
              <div style="font-weight: 600; color: var(--error);">NIM tidak ditemukan</div>
              <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">Pastikan kamu sudah mendaftar.</div>
            </div>
          `;
        } else {
          const p = results[0];
          const statusColors = {
            daftar: '#00c8ff', tes_tulis: '#f59e0b', wawancara: '#8b5cf6',
            diterima: '#10b981', ditolak: '#ef4444'
          };
          const color = statusColors[p.status] || 'var(--text-primary)';
          resultEl.innerHTML = `
            <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px;">
              <div style="font-weight: 700; font-size: 1rem; margin-bottom: 12px;">${p.nama}</div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                <span class="badge badge-muted">${p.nim}</span>
                <span class="badge badge-muted">${p.prodi}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.85rem; color: var(--text-secondary);">Status:</span>
                <span style="color: ${color}; font-weight: 700; font-size: 0.9rem;">${getStatusLabel(p.status)}</span>
              </div>
              ${p.divisiPilihan ? `<div style="margin-top: 8px; font-size: 0.82rem; color: var(--text-secondary);">Pilihan: ${p.divisiPilihan.join(' & ')}</div>` : ''}
            </div>
          `;
        }
        resultEl.style.display = 'block';
      } catch (err) {
        showToast('Gagal mengecek status: ' + err.message, 'error');
      } finally {
        setButtonLoading(btn, false);
      }
    });
  </script>
</body>
</html>
